<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷いが見えるNPC 観戦モード</title>
<style>
  :root {
    --bg: #14162b;
    --panel: #1d2142;
    --panel-2: #262b55;
    --line: #e8e6f0;
    --text: #f4f2fa;
    --muted: #a9a7c4;
    --hp: #5fd38d;
    --hp-mid: #f0c84a;
    --hp-low: #ef6a5a;
    --mp: #6aa8ff;
    --jev: #3fb8a6;
    --dec: #e39a3b;
    --rule: #9aa3b5;
    --accent: #ffd36b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Hiragino Kaku Gothic ProN", "Noto Sans JP", monospace;
    font-size: 15px; line-height: 1.5;
    padding: 16px;
  }
  .app { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0 0 8px; letter-spacing: .05em; color: var(--accent); }
  .win {
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px #4b4f7a;
    padding: 10px 12px;
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 2px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer;
  }
  select { max-width: 100%; }
  button:hover, select:hover { background: #343a72; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { background: var(--accent); color: #1b1b1b; }
  .turnno { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .info { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; overflow-wrap: anywhere; }
  .info .mid { color: var(--muted); }
  .info .result { color: var(--accent); }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
  .fighter { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
  .status .name { font-weight: bold; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; }
  .status .api { font-size: 12px; color: var(--muted); font-weight: normal; }
  .bar { height: 10px; background: #0d0f20; border: 2px solid var(--line); border-radius: 3px; overflow: hidden; margin: 2px 0 4px; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--hp); transition: width .35s ease; }
  .bar.mp { height: 7px; }
  .bar.mp > i { background: var(--mp); }
  .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .potions { display: inline-flex; gap: 3px; vertical-align: middle; }
  .potion { width: 8px; height: 11px; border: 2px solid var(--line); border-radius: 2px 2px 3px 3px; background: #c45bd6; }
  .potion.empty { background: transparent; opacity: .35; }

  .arena { position: relative; height: 150px; display: flex; align-items: flex-end; justify-content: center; }
  .arena::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 4px; height: 8px; border-radius: 50%; background: #0b0c1a; }
  .knight { position: relative; z-index: 1; width: 112px; height: 112px; image-rendering: pixelated; transition: opacity .3s; }
  .knight svg { width: 100%; height: 100%; display: block; }
  .knight.flip svg { transform: scaleX(-1); }
  .knight.shake { animation: shake .5s ease-in-out infinite; }
  .knight.ko { opacity: .25; transform: rotate(80deg) translateY(20px); transition: transform .5s, opacity .5s; }
  .knight.hit { animation: hit .35s ease; }
  @keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -2px 0; } 75% { translate: 2px 0; } }
  @keyframes hit { 0% { translate: 0 0; filter: brightness(2); } 50% { translate: 4px 0; } 100% { translate: 0 0; } }
  .aura { position: absolute; inset: 6px 18px 0; border-radius: 50% 50% 40% 40%; z-index: 0;
          box-shadow: 0 0 18px 6px rgba(255, 211, 107, .55); animation: pulse 1s ease-in-out infinite alternate; display: none; }
  .charging .aura { display: block; }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  .shield { position: absolute; z-index: 2; width: 74px; height: 96px; bottom: 10px; border: 3px solid #9fd8ff;
            border-radius: 40% 40% 50% 50%; background: rgba(120, 190, 255, .18); display: none; }
  .defending .shield { display: block; animation: shieldin .3s ease; }
  @keyframes shieldin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop { position: absolute; z-index: 3; top: 18px; font-weight: bold; font-size: 22px; color: #fff;
         text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; animation: pop 1.1s ease-out forwards; pointer-events: none; }
  .pop.heal { color: var(--hp); }
  .pop.blocked { color: #9fd8ff; }
  @keyframes pop { 0% { transform: translateY(8px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-28px); opacity: 0; } }
  .tag { position: absolute; z-index: 3; top: 0; left: 50%; translate: -50% 0; font-size: 12px; padding: 0 6px;
         border: 2px solid var(--line); border-radius: 3px; background: var(--panel-2); white-space: nowrap; display: none; }
  .tag.show { display: block; }
  .tag.ko { color: var(--hp-low); }

  .thoughts h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: normal; display: flex; justify-content: space-between; }
  .thoughts .conf { color: var(--text); }
  .thoughts .conf.low { color: var(--hp-mid); }
  .opt { display: grid; grid-template-columns: 6.6em 1fr 3em; align-items: center; gap: 6px; font-size: 13px; margin: 3px 0; }
  .opt .lbl { white-space: nowrap; }
  .opt .track { height: 9px; background: #0d0f20; border-radius: 2px; overflow: hidden; }
  .opt .fill { height: 100%; background: #6c7099; transition: width .3s ease; }
  .opt .pct { text-align: right; color: var(--muted); }
  .opt.chosen .lbl { color: var(--accent); font-weight: bold; }
  .opt.chosen .lbl::before { content: "▶"; margin-right: 2px; }
  .opt.chosen .fill { background: var(--accent); }
  .thoughts .note { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .thoughts.empty { opacity: .6; }

  .msg { min-height: 86px; font-size: 16px; display: flex; flex-direction: column; justify-content: center; }
  .msg .sub { color: var(--muted); font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 620px) {
    body { padding: 12px; font-size: 14px; }
    .stage { gap: 8px; }
    .knight { width: 84px; height: 84px; }
    .arena { height: 116px; }
    .opt { grid-template-columns: 5.6em 1fr 2.6em; font-size: 12px; gap: 4px; }
    .win { padding: 8px; }
    .turnno { margin-left: 0; width: 100%; }
    select { width: 100%; }
    .toolbar button { flex: 1 1 auto; padding: 4px 6px; }
    .row { flex-wrap: wrap; }
    .thoughts h2 { flex-wrap: wrap; }
  }
  @media (max-width: 400px) {
    .opt { grid-template-columns: 1fr 2.6em; }
    .opt .track { grid-column: 1 / -1; grid-row: 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    .knight.shake, .aura, .pop, .knight.hit { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>迷いが見えるNPC ― 観戦モード</h1>

  <div class="toolbar win">
    <label for="match" class="sr">しあい</label>
    <select id="match" aria-label="試合を選ぶ"></select>
    <button id="prev" title="← キー">◀ まえへ</button>
    <button id="next" title="→ キー">つぎへ ▶</button>
    <button id="auto" title="スペースキー">じどうさいせい</button>
    <button id="speed">はやさ：ふつう</button>
    <span class="turnno" id="turnno"></span>
  </div>

  <div class="info win" id="info"></div>

  <div class="stage">
    <div class="fighter" id="f0"></div>
    <div class="fighter" id="f1"></div>
  </div>

  <div class="msg win" id="msg" aria-live="polite"></div>
  <div class="hint">キーボード：→ つぎへ / ← まえへ / スペース じどうさいせい。心の声は、そのターンにAIが各行動につけた確率です。confidence が 0.3 未満のターンは「…まよっている」と表示します。</div>
</div>

// 16x16 のドット絵（右向き）。k=輪郭 a=よろい b=かげ v=バイザー p=かざり s=けん h=つか
const PIXELS = [
  "......pp........",
  ".....pppk.......",
  "....kkkkkk......",
  "...kaaaaaak....s",
  "...kavvvvak...s.",
  "...kaaaaaak..s..",
  "....kkkkkk..s...",
  "...kbaaaabkhs...",
  "..kbaaaaaabh....",
  "..kbaakkaabk....",
  "..kbaaaaaabk....",
  "...kaaaaaak.....",
  "...kbk..kbk.....",
  "...kbk..kbk.....",
  "..kkkk..kkkk....",
  "................",
];
function knightSVG(kind) {
  const c = COLORS[kind] || COLORS.random;
  const pal = { k: "#0b0c1a", a: c.a, b: c.b, v: "#0b0c1a", p: c.p, s: "#dfe6ee", h: "#8a5a2b" };
  let rects = "";
  PIXELS.forEach((row, y) => [...row].forEach((ch, x) => {
    if (pal[ch]) rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[ch]}"/>`;
  }));
  return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

// ---- 1試合をメッセージ単位のステップ列に展開する --------------------------------
function buildSteps(m) {
  const names = [NAMES[m.left] || m.left, NAMES[m.right] || m.right];
  const idx = s => (s === "left" ? 0 : 1);
  const steps = [];
  const clone = st => st.map(x => x.slice());
  for (const turn of m.turns) {
    const st = clone(turn.s);  // [hp, mp, potions, charging]
    const base = { turn: turn.t, acts: turn.a, defending: [false, false], ko: [false, false] };
    const push = (msg, fx = [], sub = "") =>
      steps.push({ ...base, msg, sub, fx, st: clone(st), defending: base.defending.slice(), ko: base.ko.slice() });
    const intro = turn.a.map((a, i) => (a.x ? `${names[i]}は ためた ちからを ときはなつ…` : null)).filter(Boolean);
    push(`― ターン ${turn.t} ―`, [], intro.join(" ／ "));

    // 解決順：溜め開始 → 防御 → 回復 → 逃走 → 攻撃 → KO（MP回復は次ターンの状態に反映）
    for (const e of turn.ev.filter(e => e.type === "charge_start")) {
      const i = idx(e.target); st[i][1] -= 10; st[i][3] = 1;
      push(`${names[i]}は ちからを ためはじめた！`, [], "つぎの ターンに ためこうげきが くる");
    }
    turn.a.forEach((a, i) => {
      if (a.c === "defend") { base.defending[i] = true; push(`${names[i]}は ぼうぎょ の かまえ！`); }
    });
    for (const e of turn.ev.filter(e => e.type === "heal")) {
      const i = idx(e.target); st[i][0] += e.amount; st[i][2] -= 1;
      push(`${names[i]}は かいふくやく を のんだ！`,
           [{ k: "heal", i, v: e.amount }], e.amount > 0 ? `HPが ${e.amount} かいふくした` : "でも HPは まんたんだった");
    }
    for (const e of turn.ev.filter(e => e.type === "flee_success" || e.type === "flee_fail")) {
      const i = idx(e.target);
      push(`${names[i]}は にげようとした！`, [], e.type === "flee_success" ? "うまく にげきった…" : "でも にげられなかった");
    }
    for (const e of turn.ev.filter(e => e.type === "damage")) {
      const i = idx(e.target), atk = 1 - i;
      st[i][0] -= e.amount;
      if (e.source === "power_attack") st[atk][3] = 0;
      const what = e.source === "power_attack" ? "ためこうげき" : "こうげき";
      push(`${names[atk]}の ${what}！ ${names[i]}に ${e.amount}の ダメージ！`,
           [{ k: e.blocked ? "blocked" : "dmg", i, v: e.amount }], e.blocked ? "ぼうぎょで けいげんした" : "");
    }
    for (const e of turn.ev.filter(e => e.type === "ko")) {
      const i = idx(e.target); base.ko[i] = true;
      push(`${names[i]}は たおれた！`, [{ k: "ko", i }]);
    }
  }
  // 最終結果
  const last = steps[steps.length - 1];
  const wname = NAMES[m.winner];
  let msg, sub = "";
  if (m.winner === "draw") { msg = m.reason === "timeout" ? "じかんぎれ！ ひきわけ" : "あいうち！ ひきわけ"; }
  else if (m.reason === "timeout") { msg = `じかんぎれ！ ${wname}の かち！`; sub = "のこりHPが おおい ほうの かち"; }
  else if (m.reason === "flee") { msg = `しょうぶあり！ ${wname}の かち！`; sub = "あいては にげだした"; }
  else { msg = `しょうぶあり！ ${wname}の かち！`; }
  steps.push({ ...last, msg, sub, fx: [], end: true });
  return steps;
}

  [m.left, m.right].forEach((kind, i) => {
    $("f" + i).innerHTML = `
      <div class="status win">
        <div class="name"><span style="color:${(COLORS[kind] || COLORS.random).p}">${NAMES[kind] || kind}</span><span class="api">${API_LABEL[kind] || kind}</span></div>
        <div class="row"><span>HP</span><span class="hpnum"></span></div>
        <div class="bar hp"><i></i></div>
        <div class="row"><span>MP <span class="mpnum"></span></span><span>かいふくやく <span class="potions"></span></span></div>
        <div class="bar mp"><i></i></div>
      </div>
      <div class="arena">
        <div class="tag"></div>
        <div class="knight ${i === 1 ? "flip" : ""}"><div class="aura"></div><div class="shield"></div>${knightSVG(kind)}</div>
      </div>
      <div class="thoughts win"></div>`;
  });
}

function hpColor(hp) { return hp >= 50 ? "var(--hp)" : hp >= 20 ? "var(--hp-mid)" : "var(--hp-low)"; }

function renderThoughts(el, a) {
  if (!a) { el.className = "thoughts win empty"; el.innerHTML = ""; return; }
  if (a.x) { el.className = "thoughts win"; el.innerHTML = `<h2>心の声</h2><div class="note">（ちからを ためている）</div>`; return; }
  if (a.n) { el.className = "thoughts win"; el.innerHTML = `<h2>心の声</h2><div class="note">（ルールどおりに ${ACT_JA[a.c]}）</div>`; return; }
  const low = a.f != null && a.f < LOW_CONF;
  const opts = ACTS.filter(k => k in a.p).map(k => {
    const p = a.p[k];
    return `<div class="opt ${k === a.c ? "chosen" : ""}"><span class="lbl">${ACT_JA[k]}</span>` +
           `<span class="track"><span class="fill" style="width:${(p * 100).toFixed(0)}%;display:block"></span></span>` +
           `<span class="pct">${Math.round(p * 100)}%</span></div>`;
  }).join("");
  el.className = "thoughts win";
  el.innerHTML = `<h2><span>心の声</span><span class="conf ${low ? "low" : ""}">confidence ${a.f.toFixed(2)}</span></h2>${opts}`;
}

function render(animate) {
  const s = steps[pos];
  [0, 1].forEach(i => {
    const f = $("f" + i), [hp, mp, po, ch] = s.st[i];
    const hpv = Math.max(0, hp);
    f.querySelector(".hpnum").textContent = `${hpv} / 100`;
    const bar = f.querySelector(".bar.hp > i");
    bar.style.width = `${hpv}%`; bar.style.background = hpColor(hpv);
    f.querySelector(".mpnum").textContent = `${mp} / 30`;
    f.querySelector(".bar.mp > i").style.width = `${(mp / 30) * 100}%`;
    f.querySelector(".potions").innerHTML = [0, 1].map(k => `<span class="potion ${k < po ? "" : "empty"}"></span>`).join("");

    const a = s.acts[i];
    const knight = f.querySelector(".knight");
    const arena = f.querySelector(".arena");
    const hesitating = !s.end && a && !a.x && !a.n && a.f != null && a.f < LOW_CONF;
    knight.classList.toggle("shake", hesitating && !s.ko[i]);
    knight.classList.toggle("ko", s.ko[i]);
    arena.classList.toggle("charging", !!ch && !s.ko[i]);
    arena.classList.toggle("defending", s.defending[i] && !s.end);
    const tag = f.querySelector(".tag");
    tag.className = "tag";
    if (s.ko[i]) { tag.textContent = "KO"; tag.classList.add("show", "ko"); }
    else if (hesitating) { tag.textContent = "…まよっている"; tag.classList.add("show"); }
    else if (ch) { tag.textContent = "ためちゅう"; tag.classList.add("show"); }
    renderThoughts(f.querySelector(".thoughts"), s.end ? null : a);
  });
  if (animate) {
    for (const fx of s.fx) {
      const arena = $("f" + fx.i).querySelector(".arena");
      if (fx.k === "ko") continue;
      const pop = document.createElement("div");
      pop.className = "pop " + (fx.k === "heal" ? "heal" : fx.k === "blocked" ? "blocked" : "");
      pop.textContent = (fx.k === "heal" ? "+" : "-") + fx.v;
      arena.appendChild(pop);
      setTimeout(() => pop.remove(), 1200);
      if (fx.k !== "heal") {
        const kn = arena.querySelector(".knight");
        kn.classList.remove("hit"); void kn.offsetWidth; kn.classList.add("hit");
      }
    }
  }
  $("msg").innerHTML = `<div>${s.msg}</div>${s.sub ? `<div class="sub">${s.sub}</div>` : ""}`;
  $("turnno").textContent = `ターン ${s.turn} / ${match.turns.length}　（${pos + 1} / ${steps.length}）`;
  $("prev").disabled = pos === 0;
  $("next").disabled = pos === steps.length - 1;
  history.replaceState(null, "", `#m=${match.id}&s=${pos}`);
}

function resultText(m) {
  if (m.winner === "draw") return "ひきわけ";
  const why = { ko: "KO", flee: "あいての にげ", timeout: "じかんぎれ" }[m.reason] || m.reason;
  return `${NAMES[m.winner]}の かち（${why}、${m.turns.length}ターン）`;
}

function loadMatch(id, step = 0) {
  stopAuto();
  match = DATA.matches.find(m => m.id === id) || DATA.matches[0];
  steps = buildSteps(match);
  pos = Math.min(Math.max(0, step), steps.length - 1);
  $("match").value = match.id;
  $("info").innerHTML =
    `<span class="mid">${match.id}</span>` +
    `<span>ひだり：${API_LABEL[match.left]}　みぎ：${API_LABEL[match.right]}</span>` +
    `<span class="result">けっか：${resultText(match)}</span>`;
  setupFighters(match);
  render(false);
}

function go(d) {
  const np = pos + d;
  if (np < 0 || np >= steps.length) { if (np >= steps.length) stopAuto(); return; }
  pos = np; render(d > 0);
}
function stopAuto() { clearInterval(timer); timer = null; $("auto").classList.remove("on"); $("auto").textContent = "じどうさいせい"; }
function startAuto() {
  stopAuto();
  if (pos >= steps.length - 1) { pos = 0; render(false); }
  timer = setInterval(() => go(1), fast ? 650 : 1300);
  $("auto").classList.add("on"); $("auto").textContent = "■ とめる";
}

function init() {
  const sel = $("match");
  const label = m => `${m.id}（${resultText(m)}）`;
  const og1 = document.createElement("optgroup"); og1.label = "おすすめ";
  const og2 = document.createElement("optgroup"); og2.label = "Jev vs Decisions（全試合）";
  for (const m of DATA.matches) {
    const o = new Option(label(m), m.id);
    (DATA.featured.includes(m.id) ? og1 : og2).appendChild(o);
  }
  sel.append(og1, og2);
  sel.addEventListener("change", () => loadMatch(sel.value));
  $("prev").addEventListener("click", () => { stopAuto(); go(-1); });
  $("next").addEventListener("click", () => { stopAuto(); go(1); });
  $("auto").addEventListener("click", () => (timer ? stopAuto() : startAuto()));
  $("speed").addEventListener("click", () => {
    fast = !fast; $("speed").textContent = `はやさ：${fast ? "はやい" : "ふつう"}`;
    if (timer) startAuto();
  });
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "ArrowRight") { stopAuto(); go(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { stopAuto(); go(-1); e.preventDefault(); }
    else if (e.key === " ") { timer ? stopAuto() : startAuto(); e.preventDefault(); }
  });
  const h = new URLSearchParams(location.hash.slice(1));
  loadMatch(h.get("m") || DATA.initial, parseInt(h.get("s") || "0", 10));
}
init();
</script>
</body>
</html>
